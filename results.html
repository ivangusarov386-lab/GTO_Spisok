<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Результаты ГТО</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .hwrap, main.wide { max-width: 1240px; }
  /* Шапка с фильтрами высокая — пусть уезжает, а заголовки таблицы остаются */
  header { position: static; }
  main.wide { max-width: calc(1240px + 32px); }

  .stats.four { grid-template-columns: repeat(4, 1fr); }
  .stat.withres { --c: var(--present); }
  .stat.nores { --c: var(--warn); }
  .stat.here { --c: var(--male); }
  @media (max-width: 560px) { .stats.four { grid-template-columns: repeat(2, 1fr); } }

  /* ---- Нормативы: заполненность ---- */
  .disc { display: flex; gap: 6px; overflow-x: auto; margin-top: 12px; padding-bottom: 2px; scrollbar-width: none; }
  .disc::-webkit-scrollbar { display: none; }
  .dchip {
    flex: none; display: inline-flex; flex-direction: column; gap: 4px;
    min-width: 92px; padding: 7px 10px 8px;
    border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink);
  }
  .dchip .dn { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .dchip .dc { font-size: 11px; color: var(--muted); }
  .dchip .mini { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .dchip .mini i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .dchip.empty { opacity: .55; }

  /* ---- Фильтры ---- */
  .filters { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .filters select, .filters .chk {
    height: 40px; padding: 0 12px;
    border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink);
    font: inherit; font-size: 13.5px;
    box-shadow: var(--shadow-sm);
  }
  .filters select { cursor: pointer; padding-right: 8px; }
  .filters select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .filters .chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .filters .chk input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .filters .grow { flex: 1; }
  .filters .xls { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; }
  .count { font-size: 12.5px; color: var(--muted); align-self: center; white-space: nowrap; }

  /* ---- Таблица ---- */
  .tablewrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: auto;
    max-height: calc(100vh - 24px);
  }
  table.res { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
  .res th, .res td { padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  /* Пунктир между столбцами (после «ФИО»), чтобы было видно, какой результат к какому нормативу */
  .res th:nth-child(n+3), .res td:nth-child(n+3) {
    border-left: 1px dashed color-mix(in srgb, var(--muted) 45%, transparent);
  }
  .res thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--surface-2);
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-align: center;
  }
  .res th.l, .res td.l { text-align: left; }
  .res td { text-align: center; font-variant-numeric: tabular-nums; }
  .res td.v { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .res td.v.none { color: var(--border); }
  /* Знаки ГТО: золото — жёлтый, серебро — серый, бронза — оранжевый (как в протоколе) */
  .lv3, .lv2, .lv1 { display: inline-block; min-width: 42px; padding: 2px 7px; border-radius: 7px; color: #1d1d1d; }
  .lv3 { background: #FFD966; }
  .lv2 { background: #D9D9D9; }
  .lv1 { background: #F4B183; }
  .card .cell .val .lv3, .card .cell .val .lv2, .card .cell .val .lv1 { min-width: 0; }
  .lvlegend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 10px 2px 0; }
  .lvlegend span[class^="lv"] { font-weight: 600; min-width: 0; }
  .lvlegend[hidden] { display: none; }
  .res tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 60%, var(--surface)); }
  .res tbody tr:last-child td { border-bottom: 0; }
  .res .stick { position: sticky; left: 0; z-index: 1; background: var(--surface); }
  .res thead .stick { z-index: 3; background: var(--surface-2); }
  .res .stick2 { position: sticky; left: 46px; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--border); }
  .res thead .stick2 { z-index: 3; background: var(--surface-2); }
  .res td.n { color: var(--muted); font-weight: 600; width: 46px; min-width: 46px; }
  .res .fio { font-weight: 600; }
  .res .sub { display: flex; gap: 5px; margin-top: 3px; align-items: center; }
  /* Пришедшие (отмечены на странице «Явка») — лёгкая зелёная подсветка, как там */
  .res tbody tr.present td,
  .res tbody tr.present td.stick,
  .res tbody tr.present td.stick2 { background: color-mix(in srgb, var(--present-soft) 70%, var(--surface)); }
  .res tbody tr.present td:first-child { box-shadow: inset 3px 0 0 var(--present); color: var(--present); }
  .res tbody tr.present:hover td { background: var(--present-soft); }
  .card.present {
    background: linear-gradient(100deg, var(--present-soft) 0%, var(--surface) 85%);
    border-color: color-mix(in srgb, var(--present) 45%, var(--border));
    box-shadow: inset 3px 0 0 var(--present), var(--shadow-sm);
  }
  .card.present .num { background: linear-gradient(135deg, var(--present), var(--present-2)); color: var(--on-present); }
  .here-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--present); margin-left: 6px; vertical-align: middle; }


  /* ---- Карточки (телефон) ---- */
  .cards { display: none; flex-direction: column; gap: 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow-sm);
  }
  .card .top { display: flex; gap: 10px; align-items: flex-start; }
  .card .num {
    width: 38px; height: 38px; flex: none; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--surface-2); color: var(--muted); font-weight: 600;
  }
  .card .fio { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .card .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 10px; }
  .card .cell { background: var(--surface-2); border-radius: 9px; padding: 6px 8px; }
  .card .cell .k { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .cell .val { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; margin-top: 1px; }
  .card .nores { margin-top: 8px; font-size: 12.5px; color: var(--muted); }

  @media (max-width: 820px) {
    .tablewrap { display: none; }
    .cards { display: flex; }
  }

  .notice {
    background: var(--warn-soft); color: var(--ink);
    border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--border));
    border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5;
    margin-bottom: 10px;
  }
  .notice[hidden] { display: none; }
  .updated { font-size: 11.5px; color: var(--muted); text-align: right; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hwrap">
      <div class="titlebar">
        <div class="brand">
          <div class="logo">ГТО</div>
          <h1 class="sr">Результаты ГТО</h1>
          <nav class="tabs" aria-label="Разделы">
            <a href="index.html">Явка</a>
            <a href="results.html" aria-current="page">Результаты</a>
          </nav>
          <span class="evpill" id="evPill" hidden></span>
        </div>
        <div class="hright">
          <div class="status" title="Связь с таблицей"><span class="dot" id="dot"></span><span class="stxt" id="statusText">загрузка…</span></div>
          <button class="iconbtn" id="refreshBtn" title="Обновить" aria-label="Обновить">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </div>

      <div class="stats four">
        <div class="stat total"><span class="lbl">Участников</span><b class="mono" id="sTotal">0</b></div>
        <div class="stat withres"><span class="lbl">С результатами</span><b class="mono" id="sWith">0</b></div>
        <div class="stat nores"><span class="lbl">Без результатов</span><b class="mono" id="sWithout">0</b></div>
        <div class="stat here"><span class="lbl">Пришли</span><b class="mono" id="sHere">0</b></div>
      </div>

      <div class="disc" id="disc" aria-label="Нормативы: сколько результатов внесено"></div>

      <div class="searchline">
        <div class="searchrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="ФИО, номер или УИН…" autocomplete="off">
          <span class="kbd" title="Delete — очистить поиск">Del</span>
        </div>
      </div>

      <div class="filters">
        <select id="fStupen" aria-label="Ступень"><option value="">Все ступени</option></select>
        <select id="fPol" aria-label="Пол"><option value="">Любой пол</option></select>
        <select id="fClass" aria-label="Класс"><option value="">Все классы</option></select>
        <select id="fSort" aria-label="Сортировка"></select>
        <label class="chk"><input type="checkbox" id="fHasRes"> только с результатами</label>
        <span class="grow"></span>
        <span class="count" id="count"></span>
        <button class="btn xls" id="xlsBtn" title="Скачать в Excel то, что сейчас показано. Знаки пересчитываются при правке результатов">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Excel
        </button>
      </div>
    </div>
  </header>

  <main class="wide">
    <div class="notice" id="notice" hidden></div>
    <div class="tablewrap"><table class="res" id="table"></table></div>
    <div class="cards" id="cards"></div>
    <div class="empty" id="emptyMsg" hidden>
      <div class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
      <div id="emptyText">Никого не нашли.</div>
    </div>
    <div class="lvlegend" id="lvLegend" hidden>Знаки по нормативам ГТО:
      <span class="lv3">золото</span><span class="lv2">серебро</span><span class="lv1">бронза</span>
    </div>
    <div class="updated" id="updated"></div>
  </main>
</div>

<div class="toast" id="toast" role="alert"></div>

<script>
(function () {
  var LS_KEY = 'gto_apps_script_url';
  var DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzUX-JIhoZRpt_FiNAZGpMI0p0bbGNarGGp6Q9y2NXflc6O9cHDYVoKJq2CPIZ5JSbR/exec';
  var REFRESH_MS = 30000;
  var TIMEOUT_MS = 60000;  // Apps Script после простоя «просыпается» медленно
  var scriptUrl = DEFAULT_URL;
  try { scriptUrl = localStorage.getItem(LS_KEY) || DEFAULT_URL; } catch (e) {}

  var disciplines = [];   // [{col, name}]
  var data = [];
  var sortKey = 'fio';    // 'fio' — по алфавиту (по умолчанию) | 'row' — как в таблице | 'num'
  var loading = false;
  var failStreak = 0;
  var lastJSON = '';

  var $ = function (id) { return document.getElementById(id); };
  var searchEl = $('search'), tableEl = $('table'), cardsEl = $('cards');
  var fStupen = $('fStupen'), fPol = $('fPol'), fClass = $('fClass'), fSort = $('fSort'), fHasRes = $('fHasRes');
  var refreshBtn = $('refreshBtn'), toastEl = $('toast'), toastTimer;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function setStatus(state, text) {
    $('dot').className = 'dot' + (state ? ' ' + state : '');
    $('statusText').textContent = text;
    refreshBtn.classList.toggle('attn', state === 'err');
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 7000);
  }
  toastEl.addEventListener('click', function () { toastEl.classList.remove('show'); });

  function stupenRoman(v) {
    var m = String(v || '').match(/^[IVXLCDM]+/);
    return m ? m[0] : String(v || '').split(' ')[0];
  }
  function romanToInt(r) {
    var v = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 }, n = 0;
    for (var i = 0; i < r.length; i++) {
      var a = v[r[i]] || 0, b = v[r[i + 1]] || 0;
      n += a < b ? -a : a;
    }
    return n;
  }
  function polShort(p) { return p === 'мужской' ? 'муж.' : p === 'женский' ? 'жен.' : (p || ''); }
  function classOf(d) { return (d.klass + (d.letter ? ' ' + d.letter.toUpperCase() : '')).trim(); }

  function has(v) { return String(v == null ? '' : v).trim() !== ''; }
  function resCount(d) { return d.res.filter(has).length; }

  function fillSelect(sel, values, keep) {
    var cur = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    values.forEach(function (v) { var o = el('option', '', v.label); o.value = v.value; sel.appendChild(o); });
    sel.value = keep && values.some(function (v) { return v.value === cur; }) ? cur : '';
  }

  function uniqSorted(arr, cmp) {
    return arr.filter(function (v, i, a) { return v && a.indexOf(v) === i; }).sort(cmp);
  }

  function buildFilters() {
    fillSelect(fStupen, uniqSorted(data.map(function (d) { return stupenRoman(d.stupen); }), function (a, b) { return romanToInt(a) - romanToInt(b); })
      .map(function (r) { return { value: r, label: r + ' ступень' }; }), true);
    fillSelect(fPol, uniqSorted(data.map(function (d) { return d.pol; }))
      .map(function (p) { return { value: p, label: p.charAt(0).toUpperCase() + p.slice(1) }; }), true);
    fillSelect(fClass, uniqSorted(data.map(classOf), function (a, b) { return a.localeCompare(b, 'ru', { numeric: true }); })
      .map(function (c) { return { value: c, label: c + ' класс' }; }), true);

    if (!fSort.options.length) {
      [{ v: 'fio', t: 'По алфавиту' }, { v: 'row', t: 'Как в таблице' }, { v: 'num', t: 'По номеру' }]
        .forEach(function (o) { var op = el('option', '', o.t); op.value = o.v; fSort.appendChild(op); });
    }
    fSort.value = sortKey;
  }

  function buildDiscChips() {
    var box = $('disc');
    box.innerHTML = '';
    disciplines.forEach(function (d, j) {
      var filled = data.filter(function (x) { return has(x.res[j]); }).length;
      var pct = data.length ? Math.round(filled / data.length * 100) : 0;
      var b = el('div', 'dchip' + (filled ? '' : ' empty'));
      b.title = d.name + ' (столбец ' + d.col + '): внесено ' + filled + ' из ' + data.length;
      b.appendChild(el('span', 'dn', d.name));
      b.appendChild(el('span', 'dc', filled + ' из ' + data.length));
      var mini = el('span', 'mini'); var i = el('i'); i.style.width = pct + '%'; mini.appendChild(i); b.appendChild(mini);
      box.appendChild(b);
    });
  }

  function setSort(k) {
    sortKey = k;
    fSort.value = k;
    render();
  }

  function filtered() {
    var q = searchEl.value.trim().toLowerCase();
    var st = fStupen.value, pol = fPol.value, cl = fClass.value, onlyRes = fHasRes.checked;
    var list = data.filter(function (d) {
      if (st && stupenRoman(d.stupen) !== st) return false;
      if (pol && d.pol !== pol) return false;
      if (cl && classOf(d) !== cl) return false;
      if (onlyRes && !resCount(d)) return false;
      if (q && [d.num, d.fio, d.uin].join(' ').toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    list.sort(function (a, b) {
      if (sortKey === 'row') return a.row - b.row;
      if (sortKey === 'fio') {
        var x = String(a.fio).toLowerCase().replace(/ё/g, 'е'), y = String(b.fio).toLowerCase().replace(/ё/g, 'е');
        return x < y ? -1 : x > y ? 1 : 0;
      }
      return (+a.num || 0) - (+b.num || 0);
    });
    return list;
  }

  function stupenChip(d) {
    var r = stupenRoman(d.stupen);
    var c = el('span', 'chip stupen', r);
    c.style.setProperty('--h', (romanToInt(r) * 47 + 150) % 360);
    c.title = d.stupen;
    return c;
  }
  function polChip(d) {
    return el('span', 'chip ' + (d.pol === 'мужской' ? 'm' : d.pol === 'женский' ? 'f' : ''), polShort(d.pol));
  }
  function valueNode(d, j) {
    var v = d.res[j];
    var lvl = has(v) ? badgeLevel(d, j) : 0;
    var node = el('span', lvl ? 'lv' + lvl : '', has(v) ? shownValue(d, j) : '—');
    if (lvl) node.title = ['', 'Бронза', 'Серебро', 'Золото'][lvl];
    return node;
  }

  // ---- Знаки ГТО: пороги с листа «Нормативы» протокола (ступень + пол + столбец) ----
  var norms = {};
  function setNorms(list) {
    norms = {};
    (list || []).forEach(function (n) { norms[n.key] = n; });
    var leg = $('lvLegend');
    if (leg) leg.hidden = !Object.keys(norms).length;
  }
  function num(v) {
    if (v === '' || v === null || v === undefined) return null;
    var n = typeof v === 'number' ? v : parseFloat(String(v).trim().replace(',', '.'));
    return isNaN(n) ? null : n;
  }
  // В единицах сравнения: «мин:сек» — секунды (12,14 → 12 мин 14 с; 5,3 → 5 мин 30 с)
  // «00:01:07» и «0:12:40» — ч:мм:сс; «12:40:00» — это «12:40», которое Google превратил во время
  function hmsSeconds(h, m, sec) { return h > 0 && sec === 0 ? h * 60 + m : (h * 60 + m) * 60 + sec; }
  function compareValue(v, fmt) {
    if (fmt === 'мин:сек') {
      var t = String(v).trim(), hms = t.match(/^(\d+):(\d{1,2}):(\d{1,2})$/), mm = t.match(/^(\d+):(\d{1,2})/);
      if (hms) return hmsSeconds(+hms[1], +hms[2], +hms[3]);
      if (mm) return +mm[1] * 60 + +mm[2];
      var x = num(t);
      if (x === null) return null;
      var m = Math.floor(x);
      return m * 60 + Math.round((x - m) * 100);
    }
    return num(v);
  }
  // Длинный бег показываем как «мин:сек»: 12,40 / 12.4 / 12:40:00 → 12:40
  function secToMinSec(sec) { var m = Math.floor(sec / 60); return m + ':' + ('0' + Math.round(sec - m * 60)).slice(-2); }
  function shownValue(d, j) {
    var v = d.res[j], n = normOf(d, j);
    if (!n || n.fmt !== 'мин:сек') return v;
    var sec = compareValue(v, n.fmt);
    return sec === null ? v : secToMinSec(sec);
  }
  function badgeLevel(d, j) {
    var st = (String(d.stupen || '').trim().split(' ')[0] || '').toUpperCase();
    var key = st + '|' + String(d.pol || '').trim().toLowerCase() + '|' + String(disciplines[j].name || '').trim().toLowerCase();
    var n = norms[key];
    if (!n) return 0;
    var v = compareValue(d.res[j], n.fmt);
    if (v === null) return 0;
    var b = num(n.b), s = num(n.s), g = num(n.g), up = n.dir === 'больше';
    var ok = function (t) { return t !== null && (up ? v >= t : v <= t); };
    return ok(g) ? 3 : ok(s) ? 2 : ok(b) ? 1 : 0;
  }

  // ---- Выгрузка в Excel: результаты + лист «Нормативы»; знак считается формулами Excel ----
  // Длинный бег — «мин:сек» (12:40); число вида 12,40 тоже понимается как 12 мин 40 с.
  // Формулы без LET и текстовых чисел — работают в Excel и LibreOffice при любой локали.
  var EXCEL_LIB = 'vendor/exceljs/exceljs.min.js';
  var XL_COLORS = { 3: 'FFFFD966', 2: 'FFD9D9D9', 1: 'FFF4B183' };
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = EXCEL_LIB;
      s.onload = function () { window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error('библиотека Excel не загрузилась')); };
      s.onerror = function () { reject(new Error('библиотека Excel не загрузилась')); };
      document.head.appendChild(s);
    });
  }
  function colName(c) { var s = ''; while (c > 0) { var m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - m - 1) / 26; } return s; }
  // «мин:сек» в Excel — значение времени с форматом [h]:mm: на экране 12:40, набранное «12:40» читается так же
  var XL_TIME = '[h]:mm';
  function toXlTime(sec) { return sec / 1440; }
  // Значение для ячейки Excel: числа — числами (5,3 → 5.3; «6:20» → 6.20), остальное — текстом
  function xlValue(v) {
    if (!has(v)) return null;
    if (typeof v === 'number') return v;
    var t = String(v).trim(), mm = t.match(/^(\d+):(\d{1,2})$/);
    if (mm) return +mm[1] + +mm[2] / 100;
    if (/^[+-]?\d+([.,]\d+)?$/.test(t)) return parseFloat(t.replace(',', '.'));
    return t;
  }
  function normOf(d, j) {
    var st = (String(d.stupen || '').trim().split(' ')[0] || '').toUpperCase();
    return norms[st + '|' + String(d.pol || '').trim().toLowerCase() + '|' + String(disciplines[j].name || '').trim().toLowerCase()];
  }

  function xlSeconds(x) { return 'IF(' + x + '<1,ROUND(' + x + '*1440,0),INT(' + x + ')*60+ROUND((' + x + '-INT(' + x + '))*100,0))'; }

  function buildWorkbook(ExcelJS, list) {
    var wb = new ExcelJS.Workbook();
    wb.calcProperties.fullCalcOnLoad = true;
    var ws = wb.addWorksheet('Результаты', { views: [{ state: 'frozen', xSplit: 2, ySplit: 1 }] });
    var nw = wb.addWorksheet('Нормативы', { views: [{ state: 'frozen', ySplit: 1 }] });
    var N = "'Нормативы'!";
    var bold = { bold: true }, headFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF1F6' } };

    // Лист «Нормативы»: G:I — пороги как пишут в протоколе, K:M — они же в единицах сравнения
    nw.addRow(['Ступень', 'Пол', 'Столбец протокола', 'Испытание', 'Лучше', 'Формат', 'Бронза', 'Серебро', 'Золото',
               'ключ (служебное)', 'бронза, число', 'серебро, число', 'золото, число']);
    nw.getRow(1).font = bold;
    nw.getRow(1).fill = headFill;
    var order = disciplines.map(function (d) { return String(d.name).trim().toLowerCase(); });
    var nlist = Object.keys(norms).map(function (k) { return norms[k]; }).sort(function (a, b) {
      var x = a.key.split('|'), y = b.key.split('|');
      return (romanToInt(x[0]) - romanToInt(y[0])) || (order.indexOf(x[2]) - order.indexOf(y[2])) || (x[1] < y[1] ? 1 : x[1] > y[1] ? -1 : 0);
    });
    var normRow = {};
    nlist.forEach(function (n, i) {
      var r = i + 2, p = n.key.split('|'), ms = n.fmt === 'мин:сек';
      normRow[n.key] = r;
      var thr = [n.b, n.s, n.g].map(function (t) { var x = num(t); return x === null ? null : ms ? toXlTime(x) : x; });
      var row = nw.getRow(r);
      row.values = [p[0], p[1], p[2], n.name || '', n.dir, n.fmt].concat(thr);
      row.getCell(10).value = { formula: 'UPPER(TRIM(A' + r + '))&"|"&LOWER(TRIM(B' + r + '))&"|"&LOWER(TRIM(C' + r + '))', result: n.key };
      ['G', 'H', 'I'].forEach(function (c, k) {
        row.getCell(11 + k).value = { formula: 'IF(' + c + r + '="","",IF($F' + r + '="мин:сек",' + xlSeconds(c + r) + ',' + c + r + '))',
                                      result: num([n.b, n.s, n.g][k]) === null ? '' : num([n.b, n.s, n.g][k]) };
        if (ms) row.getCell(7 + k).numFmt = XL_TIME;
      });
    });
    [9, 9, 18, 44, 9, 9, 9, 9, 9, 24, 11, 11, 11].forEach(function (w, i) { nw.getColumn(i + 1).width = w; });
    [10, 11, 12, 13].forEach(function (c) { nw.getColumn(c).font = { color: { argb: 'FF999999' } }; });
    nw.addRow([]);
    var note = nw.addRow(['Время длинного бега — минуты:секунды, например 12:40. Пороги можно править — цвета на листе «Результаты» пересчитаются.']);
    nw.mergeCells(note.number, 1, note.number, 9);

    // Лист «Результаты»: видимые столбцы + скрытые служебные (номер норматива и уровень знака)
    var nd = disciplines.length, R0 = 7, M0 = R0 + nd + 1, L0 = M0 + nd;
    var head = ['№', 'ФИО', 'УИН', 'Ступень', 'Пол', 'Класс'].concat(disciplines.map(function (d) { return d.name; }));
    ws.getRow(1).values = head;
    ws.getRow(1).font = bold;
    for (var c = 1; c <= head.length; c++) ws.getRow(1).getCell(c).fill = headFill;
    for (var j = 0; j < nd; j++) { ws.getRow(1).getCell(M0 + j).value = 'служ.'; ws.getRow(1).getCell(L0 + j).value = 'служ.'; }
    list.forEach(function (d, i) {
      var r = i + 2, row = ws.getRow(r);
      row.values = [xlValue(d.num), d.fio, d.uin, d.stupen, d.pol, classOf(d)];
      for (var j = 0; j < nd; j++) {
        var n = normOf(d, j), x = colName(R0 + j) + r, m = colName(M0 + j) + r;
        var cell = row.getCell(R0 + j);
        var sec = n && n.fmt === 'мин:сек' && has(d.res[j]) ? compareValue(d.res[j], n.fmt) : null;
        if (sec !== null) { cell.value = toXlTime(sec); cell.numFmt = XL_TIME; }
        else cell.value = xlValue(d.res[j]);
        cell.alignment = { horizontal: 'center' };
        row.getCell(M0 + j).value = {
          formula: 'IFERROR(MATCH(UPPER(LEFT(TRIM($D' + r + '),FIND(" ",TRIM($D' + r + ')&" ")-1))&"|"&LOWER(TRIM($E' + r + '))&"|"&LOWER(TRIM(' + colName(R0 + j) + '$1)),' + N + '$J:$J,0),"")',
          result: n ? normRow[n.key] : '' };
        var V = 'IF(INDEX(' + N + '$F:$F,' + m + ')="мин:сек",' + xlSeconds(x) + ',' + x + ')';
        var T = function (col) { return 'INDEX(' + N + '$' + col + ':$' + col + ',' + m + ')'; };
        var cmp = function (col, op) { return 'AND(' + T(col) + '<>"",' + V + op + T(col) + ')'; };
        var lv = function (op) { return 'IF(' + cmp('M', op) + ',3,IF(' + cmp('L', op) + ',2,IF(' + cmp('K', op) + ',1,0)))'; };
        row.getCell(L0 + j).value = {
          formula: 'IF(OR(' + m + '="",NOT(ISNUMBER(' + x + '))),0,IF(INDEX(' + N + '$E:$E,' + m + ')="больше",' + lv('>=') + ',' + lv('<=') + '))',
          result: has(d.res[j]) ? badgeLevel(d, j) : 0 };
      }
    });
    [6, 34, 15, 22, 10, 8].forEach(function (w, i) { ws.getColumn(i + 1).width = w; });
    for (var k = 0; k < nd; k++) {
      ws.getColumn(R0 + k).width = Math.max(9, String(disciplines[k].name).length + 3);
      ws.getColumn(M0 + k).hidden = true;
      ws.getColumn(L0 + k).hidden = true;
    }
    if (nd && list.length) {
      var last = list.length + 1;
      ws.addConditionalFormatting({
        ref: colName(R0) + '2:' + colName(R0 + nd - 1) + last,
        rules: [3, 2, 1].map(function (lvl, i) {
          return { type: 'expression', priority: i + 1, formulae: [colName(L0) + '2=' + lvl],
                   style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: XL_COLORS[lvl] } } } };
        })
      });
      ws.autoFilter = { from: 'A1', to: colName(R0 + nd - 1) + '1' };
    }
    if (nd && list.length) addStageSheets(wb, list, { nd: nd, R0: R0, nlist: nlist, headFill: headFill, lv: levelFormula });
    return wb;
  }

  // Формула уровня знака (0–3) для результата x по строке норматива m на листе «Нормативы»
  function levelFormula(x, m) {
    var N = "'Нормативы'!";
    var V = 'IF(INDEX(' + N + '$F:$F,' + m + ')="мин:сек",' + xlSeconds(x) + ',' + x + ')';
    var T = function (col) { return 'INDEX(' + N + '$' + col + ':$' + col + ',' + m + ')'; };
    var cmp = function (col, op) { return 'AND(' + T(col) + '<>"",' + V + op + T(col) + ')'; };
    var lv = function (op) { return 'IF(' + cmp('M', op) + ',3,IF(' + cmp('L', op) + ',2,IF(' + cmp('K', op) + ',1,0)))'; };
    return 'IF(OR(' + m + '="",NOT(ISNUMBER(' + x + '))),0,IF(INDEX(' + N + '$E:$E,' + m + ')="больше",' + lv('>=') + ',' + lv('<=') + '))';
  }

  // Листы по ступеням: участники ступени, в G — выпадающий список нормативов их ступени и пола,
  // в H — результат по выбранному нормативу с листа «Результаты» (подсвечен знаком).
  // Служебно: скрытый лист «_списки» (названия нормативов по ступени и полу), скрытые столбцы J:K.
  function addStageSheets(wb, list, o) {
    var lists = wb.addWorksheet('_списки', { state: 'hidden' });
    var LS = "'_списки'!", RS = "'Результаты'!", NS = "'Нормативы'!";
    var resCols = colName(o.R0) + '$1:$' + colName(o.R0 + o.nd - 1) + '$1';
    var groups = {}, slot = {}, col = 1;
    o.nlist.forEach(function (n) {
      var p = n.key.split('|'), g = p[0] + '|' + p[1];
      if (!groups[g]) groups[g] = [];
      groups[g].push({ label: n.name || p[2], col: p[2] });
    });
    Object.keys(groups).forEach(function (g) {
      var seen = {};
      var items = groups[g].map(function (it) {
        var label = seen[it.label] ? it.label + ' (' + it.col + ')' : it.label;
        seen[label] = true;
        return [label, it.col];
      });
      lists.getRow(1).getCell(col).value = g;
      items.forEach(function (it, i) { lists.getRow(i + 2).getCell(col).value = it[0]; lists.getRow(i + 2).getCell(col + 1).value = it[1]; });
      var a = colName(col), b = colName(col + 1), last = items.length + 1;
      slot[g] = { labels: LS + '$' + a + '$2:$' + a + '$' + last, cols: LS + '$' + b + '$2:$' + b + '$' + last };
      col += 2;
    });

    var stages = {};
    list.forEach(function (d, i) {
      var st = (String(d.stupen || '').trim().split(' ')[0] || '').toUpperCase() || '—';
      (stages[st] = stages[st] || []).push({ d: d, src: i + 2 });
    });
    Object.keys(stages).sort(function (a, b) { return romanToInt(a) - romanToInt(b); }).forEach(function (st) {
      var ws = wb.addWorksheet((st + ' ступень').slice(0, 31), { views: [{ state: 'frozen', xSplit: 2, ySplit: 1 }] });
      ws.getRow(1).values = ['№', 'ФИО', 'УИН', 'Ступень', 'Пол', 'Класс', 'Норматив', 'Результат', '', 'столбец (служ.)', 'норматив № (служ.)', 'знак (служ.)'];
      ws.getRow(1).font = { bold: true };
      for (var c = 1; c <= 8; c++) ws.getRow(1).getCell(c).fill = o.headFill;
      stages[st].forEach(function (it, i) {
        var r = i + 2, d = it.d, row = ws.getRow(r);
        var sl = slot[st + '|' + String(d.pol || '').trim().toLowerCase()];
        row.values = [xlValue(d.num), d.fio, d.uin, d.stupen, d.pol, classOf(d)];
        if (sl) {
          row.getCell(7).dataValidation = { type: 'list', allowBlank: true, formulae: [sl.labels],
            showErrorMessage: true, errorTitle: 'Норматив', error: 'Выберите норматив из списка' };
          row.getCell(10).value = { formula: 'IF($G' + r + '="","",IFERROR(INDEX(' + sl.cols + ',MATCH($G' + r + ',' + sl.labels + ',0)),""))', result: '' };
        }
        var src = RS + '$' + colName(o.R0) + '$' + it.src + ':$' + colName(o.R0 + o.nd - 1) + '$' + it.src;
        var pick = 'INDEX(' + src + ',MATCH($J' + r + ',' + RS + '$' + resCols + ',0))';
        row.getCell(8).value = { formula: 'IF($J' + r + '="","",IFERROR(IF(' + pick + '="","",' + pick + '),""))', result: '' };
        row.getCell(8).alignment = { horizontal: 'center' };
        row.getCell(11).value = { formula: 'IF($J' + r + '="","",IFERROR(MATCH(UPPER(LEFT(TRIM($D' + r + '),FIND(" ",TRIM($D' + r + ')&" ")-1))&"|"&LOWER(TRIM($E' + r + '))&"|"&LOWER(TRIM($J' + r + ')),' + NS + '$J:$J,0),""))', result: '' };
        row.getCell(12).value = { formula: o.lv('H' + r, 'K' + r), result: 0 };
      });
      [6, 34, 15, 22, 10, 8, 44, 12, 3].forEach(function (w, i) { ws.getColumn(i + 1).width = w; });
      [10, 11, 12].forEach(function (c) { ws.getColumn(c).hidden = true; });
      var last = stages[st].length + 1;
      var rules = [3, 2, 1].map(function (lvl, i) {
        return { type: 'expression', priority: i + 1, formulae: ['$L2=' + lvl],
                 style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: XL_COLORS[lvl] } } } };
      });
      rules.push({ type: 'expression', priority: 4, formulae: ['AND($K2<>"",INDEX(' + NS + '$F:$F,$K2)="мин:сек")'], style: { numFmt: XL_TIME } });
      ws.addConditionalFormatting({ ref: 'H2:H' + last, rules: rules });
      ws.autoFilter = { from: 'A1', to: 'H1' };
    });
  }

  function exportExcel() {
    var list = filtered();
    if (!list.length) { toast('Нечего выгружать: список пуст.'); return; }
    var btn = $('xlsBtn');
    btn.disabled = true;
    loadExcelJS()
      .then(function (ExcelJS) { return buildWorkbook(ExcelJS, list).xlsx.writeBuffer(); })
      .then(function (buf) {
        var ev = ($('evPill').textContent || '').trim();
        var name = ('ГТО результаты' + (ev ? ' ' + ev : '')).replace(/[\\/:*?"<>|]+/g, '-') + '.xlsx';
        var url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        toast('Скачано: ' + name + ' (' + list.length + ' чел.)');
      })
      .catch(function (err) { toast('Не получилось сделать Excel: ' + (err && err.message || err)); })
      .then(function () { btn.disabled = false; });
  }

  function render() {
    var list = filtered();
    $('count').textContent = 'Показано: ' + list.length + ' из ' + data.length;
    $('emptyMsg').hidden = list.length > 0 || !data.length;

    // ---- таблица ----
    tableEl.innerHTML = '';
    var thead = el('thead'), hr = el('tr');
    function th(text, cls, title) {
      var t = el('th', cls || '', text);
      if (title) t.title = title;
      hr.appendChild(t);
    }
    th('№', 'stick');
    th('ФИО', 'l stick2');
    th('Класс');
    disciplines.forEach(function (d) { th(d.name, '', 'Столбец ' + d.col); });
    thead.appendChild(hr);
    tableEl.appendChild(thead);
    var tb = el('tbody');
    list.forEach(function (d) {
      var tr = el('tr', isHere(d) ? 'present' : '');
      tr.appendChild(el('td', 'n stick mono', d.num));
      var who = el('td', 'l stick2');
      var f = el('div', 'fio', d.fio);
      if (isHere(d)) { var hd = el('span', 'here-dot'); hd.title = 'Пришёл'; f.appendChild(hd); }
      who.appendChild(f);
      var sub = el('div', 'sub');
      sub.appendChild(stupenChip(d)); sub.appendChild(polChip(d));
      if (d.uin) sub.appendChild(el('span', 'uin mono', d.uin));
      who.appendChild(sub);
      tr.appendChild(who);
      tr.appendChild(el('td', 'mono', classOf(d)));
      disciplines.forEach(function (disc, j) {
        var td = el('td', 'v' + (has(d.res[j]) ? '' : ' none'));
        td.appendChild(valueNode(d, j));
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tableEl.appendChild(tb);

    // ---- карточки ----
    cardsEl.innerHTML = '';
    list.forEach(function (d) {
      var c = el('div', 'card' + (isHere(d) ? ' present' : ''));
      var top = el('div', 'top');
      top.appendChild(el('div', 'num mono', d.num));
      var who = el('div');
      var f = el('div', 'fio', d.fio);
      if (isHere(d)) { var hd = el('span', 'here-dot'); hd.title = 'Пришёл'; f.appendChild(hd); }
      who.appendChild(f);
      var sub = el('div', 'meta');
      sub.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;font-size:12px;color:var(--muted)';
      sub.appendChild(stupenChip(d)); sub.appendChild(polChip(d));
      if (classOf(d)) sub.appendChild(el('span', '', classOf(d) + ' кл.'));
      if (d.uin) sub.appendChild(el('span', 'uin mono', d.uin));
      who.appendChild(sub);
      top.appendChild(who);
      c.appendChild(top);
      var cells = el('div', 'grid');
      disciplines.forEach(function (disc, j) {
        if (!has(d.res[j])) return;
        var cell = el('div', 'cell');
        cell.appendChild(el('div', 'k', disc.name));
        var v = el('div', 'val'); v.appendChild(valueNode(d, j)); cell.appendChild(v);
        cells.appendChild(cell);
      });
      if (cells.children.length) c.appendChild(cells);
      else c.appendChild(el('div', 'nores', 'Результатов пока нет'));
      cardsEl.appendChild(c);
    });
  }

  // Отметки «пришёл»: если на странице «Явка» они сохранены позже, чем загружены результаты, — берём оттуда
  var resultsTime = 0;
  var marks = null;
  function refreshMarks() {
    marks = null;
    try {
      var c = JSON.parse(localStorage.getItem('gto_cache_list_v1') || 'null');
      if (!c || c.url !== scriptUrl || !c.data || !(c.savedAt > resultsTime)) return;
      marks = {};
      c.data.forEach(function (d) { marks[String(d.uin || '').replace(/\D/g, '') || ('#' + d.num)] = !!d.present; });
    } catch (e) { marks = null; }
  }
  function isHere(d) {
    if (marks) {
      var k = String(d.uin || '').replace(/\D/g, '') || ('#' + d.num);
      if (Object.prototype.hasOwnProperty.call(marks, k)) return marks[k];
    }
    return !!d.present;
  }
  window.addEventListener('storage', function (e) {
    if (e.key === 'gto_cache_list_v1' && data.length) { refreshMarks(); renderStats(); render(); }
  });

  function renderStats() {
    var withRes = data.filter(function (d) { return resCount(d) > 0; }).length;
    $('sTotal').textContent = data.length;
    $('sWith').textContent = withRes;
    $('sWithout').textContent = data.length - withRes;
    $('sHere').textContent = data.filter(isHere).length;
  }

  function requestJSON(url, timeoutMs) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer;
    var timeout = new Promise(function (_, reject) {
      timer = setTimeout(function () {
        reject(new Error('таблица не ответила за ' + Math.round(timeoutMs / 1000) + ' с'));
        if (ctrl) ctrl.abort();
      }, timeoutMs);
    });
    var req = fetch(url, ctrl ? { cache: 'no-store', signal: ctrl.signal } : { cache: 'no-store' })
      .then(function (r) {
        return r.text().then(function (t) {
          try { return JSON.parse(t); } catch (e) {
            var txt = t.replace(/<(script|style)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
            var m = txt.match(/(TypeError|ReferenceError|SyntaxError|Exception|Error|Ошибка|Script function not found|Authorization is required|Требуется авторизация)[^.]{0,160}/i);
            throw new Error('скрипт ответил не данными, а страницей (HTTP ' + r.status + ')' + (m ? ': «' + m[0].trim() + '»' : ''));
          }
        });
      });
    return Promise.race([req, timeout]).then(
      function (v) { clearTimeout(timer); return v; },
      function (e) { clearTimeout(timer); throw e; }
    );
  }

  // ---- Память браузера: таблица показывается сразу, свежие данные подтягиваются в фоне ----
  var CACHE_KEY = 'gto_cache_results_v1';
  var fromCache = false;

  function showEvent(name) {
    var pill = $('evPill');
    pill.textContent = name || '';
    pill.title = name ? 'Загружена дата: ' + name : '';
    pill.hidden = !name;
  }

  function applyData(disc, rows) {
    disciplines = disc.map(function (d) { return { col: d.col, name: d.name }; });
    data = rows;
    refreshMarks();
    buildFilters();
    buildDiscChips();
    renderStats();
    render();
  }

  function restoreCache() {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (!c || c.url !== scriptUrl || !c.disciplines || !c.data || !c.data.length) return false;
      resultsTime = c.savedAt || 0;
      showEvent(c.event);
      setNorms(c.norms);
      applyData(c.disciplines, c.data);
      lastJSON = JSON.stringify([c.disciplines, c.data, c.norms || []]);
      fromCache = true;
      setStatus('', 'из памяти · обновление…');
      $('updated').textContent = 'Показаны сохранённые данные от ' + new Date(c.savedAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ' · обновляются…';
      return true;
    } catch (e) { return false; }
  }

  function load(manual) {
    if (loading) return;
    loading = true;
    if (manual) { refreshBtn.classList.add('spin'); setStatus('', 'обновление…'); }
    var url = scriptUrl + (scriptUrl.indexOf('?') === -1 ? '?' : '&') + 'view=results';
    requestJSON(url, TIMEOUT_MS)
      .then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || 'скрипт вернул ошибку');
        failStreak = 0;
        var notice = $('notice');
        if (!res.disciplines) {
          notice.hidden = false;
          notice.textContent = 'Скрипт в таблице ещё старой версии и не отдаёт результаты. Откройте «Расширения → Apps Script», вставьте код из apps-script/Code.gs и выпустите новую версию развёртывания (Развернуть → Управление развёртываниями → ✏️ → Новая версия).';
          setStatus('err', 'нужен новый скрипт');
          return;
        }
        notice.hidden = true;
        var json = JSON.stringify([res.disciplines, res.data, res.norms || []]);
        setStatus('ok', 'подключено · ' + res.data.length);
        $('updated').textContent = 'Обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' · обновляется само каждые 30 с';
        fromCache = false;
        showEvent(res.event);
        resultsTime = Date.now();
        if (json === lastJSON) { refreshMarks(); renderStats(); render(); return; }
        lastJSON = json;
        setNorms(res.norms);
        applyData(res.disciplines, res.data);
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ url: scriptUrl, savedAt: Date.now(), event: res.event || '', disciplines: res.disciplines, data: res.data, norms: res.norms || [] })); } catch (e) {}
      })
      .catch(function (err) {
        failStreak++;
        if (manual || failStreak >= 2 || !data.length) setStatus('err', 'нет связи с таблицей');
        if (fromCache && !manual) setStatus('err', 'нет связи · данные из памяти');
        if (manual || !data.length) {
          var m = err && err.message;
          if (!m || m === 'Failed to fetch' || /NetworkError|Load failed/i.test(m)) m = 'нет интернета, либо Google не пускает к скрипту (развёртывание удалено или доступ не «Все»)';
          toast('Нет связи с таблицей: ' + m);
        }
      })
      .then(function () {
        loading = false;
        refreshBtn.classList.remove('spin');
      });
  }

  [fStupen, fPol, fClass, fHasRes].forEach(function (s) { s.addEventListener('change', render); });
  fSort.addEventListener('change', function () { setSort(fSort.value); });
  searchEl.addEventListener('input', render);
  refreshBtn.addEventListener('click', function () { load(true); });
  $('xlsBtn').addEventListener('click', exportExcel);

  // Как на странице явки: буквы с клавиатуры — в поиск, Delete — очистить
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    var t = document.activeElement;
    if (t && (t.tagName === 'SELECT') && e.key.length === 1) return;
    var inSearch = t === searchEl;
    if (e.key === 'Delete') { e.preventDefault(); searchEl.value = ''; searchEl.focus(); render(); return; }
    if (inSearch) return;
    if (e.key === 'Backspace') { e.preventDefault(); searchEl.value = searchEl.value.slice(0, -1); }
    else if (e.key.length === 1 && e.key !== ' ') { e.preventDefault(); searchEl.value += e.key; }
    else return;
    searchEl.focus();
    render();
  });

  setInterval(function () { if (!document.hidden) load(false); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(false); });
  window.addEventListener('online', function () { load(false); });
  window.addEventListener('offline', function () { setStatus('err', 'нет интернета'); });

  if (restoreCache()) load(false);
  else load(true);
})();
</script>
</body>
</html>
